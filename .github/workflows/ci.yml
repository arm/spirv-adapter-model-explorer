name: SPIR-V Adapter for Model Explorer CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DEFAULT_PY_VERSION: "3.10"

permissions:
  contents: read

jobs:
  tests:
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        runner: ${{ fromJSON(vars.TEST_RUNNERS) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Import internal credentials from Vault
        if: ${{ github.repository_owner == 'Arm-Debug' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Checkout plugin repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          uv pip install --system . --group dev cmake ninja

      - name: Lint and Format Check
        run: |
          ruff check --output-format=github
          ruff format --check

      - name: Type Check
        run: |
          pyright

      - name: Run Tests
        shell: bash
        env:
          MATRIX_RUNNER: ${{ matrix.runner }}
          LINUX_RUNNER: ${{ vars.LINUX_RUNNER }}
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
          DEFAULT_PY_VERSION: ${{ env.DEFAULT_PY_VERSION }}
        run: |
          cmake -S . -B .native/build
          cmake --build .native/build --target SPIRV-Tools-shared --config Release
          python tools/stage_spirv_tools_for_tests.py

          PYTEST_CVG_FLAGS=""
          if [[ "$MATRIX_RUNNER" == "$LINUX_RUNNER" && \
              "$MATRIX_PYTHON_VERSION" == "$DEFAULT_PY_VERSION" ]]; then
            uv pip install --system --group coverage
            PYTEST_CVG_FLAGS="-v --cov=spirv_adapter_model_explorer --cov-report=lcov:reports/lcov.info"
          fi
          pytest --tb=short ${PYTEST_CVG_FLAGS}

      - name: Upload coverage to Qlty
        if: matrix.runner == vars.LINUX_RUNNER && matrix.python-version == env.DEFAULT_PY_VERSION
        uses: qltysh/qlty-action/coverage@9e8e09dfc3d82a968f4034f5265eaf3c142881f7 # v2.0.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: reports/lcov.info

  build:
    name: Build and Publish Wheels
    needs: [tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        runner: ${{ fromJSON(vars.TEST_RUNNERS) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Import internal credentials from Vault
        if: ${{ github.repository_owner == 'Arm-Debug' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-wheel
        with:
          python-version: ${{ matrix.python-version }}
          # Internal main builds are unique dev builds; tag builds keep the release version.
          internal-dev-version: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm' }}
          artifact-name: dist-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}

      # Explicitly configure Python for SBOM generation.
      # The wheel is built for DEFAULT_PY_VERSION (3.10), so the SBOM
      # environment must use the same Python version.
      - name: Set up Python for SBOM generation
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create wheel SBOM output directory
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        run: mkdir -p sbom

      - name: Generate wheel SBOM
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        run: |
          # Verify that the correct Python version is being used.
          python --version

          # Install CycloneDX.
          uv pip install --system --default-index https://pypi.org/simple cyclonedx-bom==7.3.0

          # Create an isolated environment using the same Python version
          # as the wheel being analysed.
          python -m venv --clear .sbom-venv
          .sbom-venv/bin/python --version

          # Install the built wheel and its dependencies.
          uv pip install --python .sbom-venv/bin/python dist/*.whl

          # Generate the SBOM.
          python -m cyclonedx_py environment .sbom-venv/bin/python \
            --output-format JSON \
            --output-file sbom/spirv-adapter-model-explorer-wheel.cdx.json

      - name: Add SBOM disclaimer
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        run: |
          python scripts/add-sbom-disclaimer.py \
            sbom/spirv-adapter-model-explorer-wheel.cdx.json

      - name: Upload wheel SBOM artifact
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == env.DEFAULT_PY_VERSION
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: project-sbom
          path: sbom/*.json
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'arm'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spirv-adapter-model-explorer
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@d77b37db2e3f7398432d34b72a12aa3e2ba87e51 # v4.6.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Download project SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: project-sbom
          path: sbom/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.whl
            sbom/*.json
          token: ${{ github.token }}

  release-internal:
    name: Release to internal PyPI
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.repository_owner != 'arm'
    needs:
      - build
    runs-on: ${{ vars.LINUX_RUNNER }}
    permissions: {}

    steps:
      - name: Import internal credentials from Vault
        if: ${{ github.repository_owner == 'Arm-Debug' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_HOST | PUBLISH_PYPI_HOST ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_USERNAME | PUBLISH_PYPI_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_PASSWORD | PUBLISH_PYPI_PASSWORD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.DEFAULT_PY_VERSION }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Check internal publishing configuration
        shell: bash
        env:
          UPLOAD_URL: ${{ env.PUBLISH_PYPI_HOST }}
        run: |
          if [[ -z "$UPLOAD_URL" ]]; then
            echo "Set PUBLISH_PYPI_HOST in Vault before publishing to Artifactory." >&2
            exit 1
          fi

      - name: Publish distribution to internal PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ env.PUBLISH_PYPI_HOST }}
          user: ${{ env.PUBLISH_PYPI_USERNAME }}
          password: ${{ env.PUBLISH_PYPI_PASSWORD }}
          packages-dir: dist/
          attestations: false

  sync-commits-to-public-repo:
    name: Sync commits to public repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arm/spirv-adapter-model-explorer
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true

      - name: Push commits to public repo
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "$SOURCE_URL"
          git fetch source main
          git checkout main
          git merge source/main
          git push origin main
