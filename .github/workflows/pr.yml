name: PR

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-title:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'PR title must not start with a capital letter. Got: "${subject}"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
