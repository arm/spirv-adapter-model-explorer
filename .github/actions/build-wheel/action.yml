name: Build wheel (composite)
description: Builds wheels for SPIR-V Adapter for Model Explorer

inputs:
  python-version:
    description: "Target Python version for the wheel, selected through CIBW_BUILD."
    required: true
  internal-dev-version:
    required: false
    default: "false"
  artifact-name:
    required: false
    default: dist

runs:
  using: "composite"
  steps:
    - name: Set up build tooling Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        # cibuildwheel 3 requires Python >=3.11; CIBW_BUILD selects the wheel interpreter.
        python-version: "3.11"

    - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      with:
        enable-cache: false

    - name: Set internal development version
      if: inputs.internal-dev-version == 'true'
      shell: bash
      run: |
        BASE_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
        SHORT_SHA="${GITHUB_SHA::7}"
        DEV_VERSION="${BASE_VERSION}.dev${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
        echo "Building internal development version ${DEV_VERSION} from ${GITHUB_SHA}"
        sed -i "s/^version = \".*\"$/version = \"${DEV_VERSION}\"/" pyproject.toml

    - name: Prepare wheel build metadata
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        case "$PYTHON_VERSION" in
          "3.10") echo "CIBW_BUILD=cp310-*" >> "$GITHUB_ENV" ;;
          "3.11") echo "CIBW_BUILD=cp311-*" >> "$GITHUB_ENV" ;;
          "3.12") echo "CIBW_BUILD=cp312-*" >> "$GITHUB_ENV" ;;
          "3.13") echo "CIBW_BUILD=cp313-*" >> "$GITHUB_ENV" ;;
          "3.14") echo "CIBW_BUILD=cp314-*" >> "$GITHUB_ENV" ;;
          *) echo "Unsupported Python version: $PYTHON_VERSION" >&2; exit 1 ;;
        esac

        SPIRV_TOOLS_REF=$(sed -n 's/^set(SPIRV_TOOLS_TAG "\([^"]*\)".*/\1/p' CMakeLists.txt)
        SPIRV_HEADERS_REF=$(sed -n 's/^set(SPIRV_HEADERS_TAG "\([^"]*\)".*/\1/p' CMakeLists.txt)
        WHEEL_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)

        uv pip install --system spdx-tools==0.8.3

        mkdir -p src/spirv_adapter_model_explorer/vendor/sboms
        python ./scripts/generate-spirv-tools-bin-sbom.py \
          --spirv-tools-ref "$SPIRV_TOOLS_REF" \
          --spirv-headers-ref "$SPIRV_HEADERS_REF" \
          --wheel-version "$WHEEL_VERSION" \
          --output src/spirv_adapter_model_explorer/vendor/sboms/spirv-tools-builds.spdx.json

    - name: Build wheel
      shell: bash
      env:
        CIBW_ARCHS: auto64
        CIBW_BUILD_FRONTEND: uv
        CIBW_BEFORE_BUILD: "uv pip install --system cmake ninja"
        CIBW_BUILD_VERBOSITY: 1
        # Linux builds run in containers; macOS and Windows inherit the host environment.
        CIBW_ENVIRONMENT_PASS_LINUX: UV_DEFAULT_INDEX UV_INDEX_INTERNAL_USERNAME UV_INDEX_INTERNAL_PASSWORD
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_SKIP: "*-musllinux_*"
      run: |
        uv pip install --system cibuildwheel==3.4.0
        python -m cibuildwheel --output-dir wheelhouse

    - name: Collect wheel artifacts
      shell: bash
      run: |
        mkdir -p dist
        mv wheelhouse/*.whl dist/

    - name: Build source distribution
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        uv build --sdist

    - name: Upload plugin package artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: ${{ inputs.artifact-name }}
        path: dist
        if-no-files-found: error
